:root{
  --bg:#FFF5F7;
  --card:#FFFFFF;
  --ink:#3A2130;
  --muted:#9B7A8B;
  --line:#F4DFE6;
  --primary:#E0487F;
  --primary-deep:#C2336A;
  --price:#E0487F;
  --rule:#7C5CE8;
  --fun:#E8952B;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{

button{font-family:inherit;border:none;background:none;cursor:pointer}

/* ===== 顶部品牌区 ===== */
.hero{

}
.hero .ring{
  position:absolute;top:-46px;right:-40px;width:190px;height:190px;
  border-radius:50%;border:1px solid rgba(224,72,127,.18);opacity:.9;
}
.hero .ring::before{
  content:"";position:absolute;inset:22px;border-radius:50%;
  border:1px dashed rgba(224,72,127,.22);
}
.hero .brand{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.hero .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.hero .sub{font-size:13px;color:var(--muted);letter-spacing:.4px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:1px;margin:6px 0 4px;color:var(--ink)}
.hero .en{font-size:12px;color:var(--muted);letter-spacing:2.5px;margin-bottom:16px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .stat{
  background:rgba(255,255,255,.85);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13px;color:#5E3A4C;
  display:flex;align-items:center;gap:6px;
}
.hero .stat b{color:var(--primary-deep);font-weight:700}

/* ===== 分类筛选 ===== */
.tabs{
  position:sticky;top:0;z-index:20;
  background:rgba(255,245,247,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:10px 16px 12px;
  border-bottom:1px solid rgba(244,223,230,.7);
}
.tabs .row{display:flex;flex-wrap:wrap;gap:8px 6px}
.tab{
  flex:1 1 auto;min-width:calc(33.333% - 8px);justify-content:center;padding:7px 10px;border-radius:999px;font-size:13px;
  color:#6B4759;background:#fff;border:1px solid var(--line);
  transition:background .15s,color .15s,transform .1s;
  display:flex;align-items:center;gap:5px;
  white-space:nowrap;
}
.tab .n{font-size:12px;opacity:.75}
.tab:active{transform:scale(.97)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.tab.on .n{opacity:.85}

/* ===== 卡片网格 ===== */
.grid{
  max-width:1080px;margin:0 auto;padding:18px 16px 6px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
}
.card{
  background:var(--card);border-radius:18px;overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(194,51,106,.06);
  transition:transform .12s ease,box-shadow .12s ease;
  cursor:pointer;position:relative;min-width:0;
}
.card:active{transform:scale(.98)}
.card .cover-wrap{position:relative;aspect-ratio:9/16;overflow:hidden;background:#FCEBF1}
.card img.cover{
  width:100%;height:100%;object-fit:cover;object-position:center 12%;
}
.card .mask{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(58,33,48,0) 55%,rgba(58,33,48,.42) 100%);
}
.card .type-tag{
  position:absolute;left:10px;top:10px;z-index:2;
  font-size:12px;font-weight:600;color:#fff;padding:4px 10px;border-radius:999px;
}
.card .type-tag.t-price{background:var(--price)}
.card .type-tag.t-rule{background:var(--rule)}
.card .type-tag.t-fun{background:var(--fun)}
.card .type-tag.t-funrun{background:var(--funrun)}
.card .cnt{
  position:absolute;right:10px;top:10px;z-index:2;
  font-size:11px;color:#fff;background:rgba(58,33,48,.45);
  padding:3px 8px;border-radius:999px;
}
.card .info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 12px 11px;color:#fff}
.card .name{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .hint{font-size:11px;margin-top:3px;opacity:.9}

/* 最后一行孤卡：横跨整行但居中保持单卡宽度 */
.card:last-child:nth-child(odd){
  grid-column:1 / -1;
  justify-self:center;
  width:min(100%, calc(50% - 7px));
}

/* ===== 空态 ===== */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* ===== 底部固定联系栏 ===== */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.dock .inner{max-width:1080px;margin:0 auto;display:flex;gap:10px}
.dock .btn{

  text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;

.dock .btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(224,72,127,.32)}
.dock .btn.primary:active{background:var(--primary-deep)}
.dock .btn.kook{

.dock .btn.kook:active{background:#1E56C8}
.dock svg{width:18px;height:18px;flex:0 0 auto}

.qrmodal.show{display:flex}

.qr-body{

/* ===== 全屏预览 ===== */
.viewer{

.viewer.show{display:flex}

.viewer .v-nav{

var CATS = [
  {key:"all", label:"全部"},
  {key:"price", label:"陪玩价格表"},
  {key:"rule", label:"权益规则"},
  {key:"fun", label:"趣味单"},
  {key:"funrun", label:"跑刀趣味单"}
];
var CAT_NAME = {price:"陪玩价格表", rule:"权益规则", fun:"趣味单", funrun:"跑刀趣味单"};
var TAG_CLASS = {price:"t-price", rule:"t-rule", fun:"t-fun", funrun:"t-funrun"};

var curCat = "all";

/* ===== 渲染筛选标签 ===== */
function renderTabs(){
  var row = document.getElementById("tabRow");
  row.innerHTML = "";
  CATS.forEach(function(c){
    var count = c.key === "all" ? ITEMS.length : ITEMS.filter(function(it){return it.cat === c.key;}).length;
    var b = document.createElement("button");
    b.className = "tab" + (c.key === curCat ? " on" : "");
    b.setAttribute("data-cat", c.key);
    b.innerHTML = '<span>'+c.label+'</span><span class="n">'+count+'</span>';
    b.addEventListener("click", function(){ setCat(c.key); });
    row.appendChild(b);
  });
}


/* 懒加载：只有进入视口的图片才开始加载（IntersectionObserver；不支持时直接加载兜底） */
var imgIO = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      var im = en.target;
      var s = im.getAttribute("data-src");
      if(s){ im.src = s; im.removeAttribute("data-src"); }
      imgIO.unobserve(im);
    }
  });
}, {rootMargin:"200px 0px 200px 0px"}) : null;
function regLazy(scope){
  var imgs = (scope||document).querySelectorAll("img[data-src]");
  for (var i=0;i<imgs.length;i++){
    if(imgIO) imgIO.observe(imgs[i]);
    else { imgs[i].src = imgs[i].getAttribute("data-src"); imgs[i].removeAttribute("data-src"); }
  }
}

/* ===== 渲染卡片 ===== */

function renderGrid(){
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var list = curCat === "all" ? ITEMS : ITEMS.filter(function(it){return it.cat === curCat;});
  grid.innerHTML = "";
  list.forEach(function(it){
    var card = document.createElement("div");
    card.className = "card";
    var cover = it.imgs[0];
    var extra = it.imgs.length > 1 ? '<span class="cnt">'+it.imgs.length+' 张</span>' : "";
    card.innerHTML =
      '<div class="cover-wrap">' +
        '<img class="cover" data-src="'+cover+'" alt="'+it.name+' 海报" loading="lazy">' +
        '<div class="mask"></div>' +
        '<span class="type-tag '+TAG_CLASS[it.cat]+'">'+CAT_NAME[it.cat]+'</span>' +
        extra +
        '<div class="info"><div class="name">'+it.name+'</div><div class="hint">点击查看详情</div></div>' +
      '</div>';
    card.addEventListener("click", function(){ openViewer(list.indexOf(it)); });
    grid.appendChild(card);
  });
  empty.style.display = list.length ? "none" : "block";
  regLazy(grid);
}

/* ===== 分类切换 ===== */
function setCat(key){
  curCat = key;
  renderTabs();
  renderGrid();
}

/* ===== 全屏预览 ===== */
var viewerList = [], viewerIdx = 0, zoom = 1, viewTotal = 0;

function openViewer(idx){
  viewerList = curCat === "all" ? ITEMS : ITEMS.filter(function(it){return it.cat === curCat;});
  viewerIdx = 0;
  for (var i=0;i<idx;i++){ viewerIdx += viewerList[i].imgs.length; }
  zoom = 1;
  viewTotal = viewerList.reduce(function(s,it){return s + it.imgs.length;}, 0);
  buildSlide();
  showViewer();
}
function buildSlide(){
  var slide = document.getElementById("vSlide");
  slide.innerHTML = "";
  slide.style.transform = "translateX(-" + (viewerIdx * 100) + "%)";
  var pos = 0;
  viewerList.forEach(function(it){
    it.imgs.forEach(function(u){
      var item = document.createElement("div");
      item.className = "v-item";
      item.innerHTML = '<img class="v-img" data-src="'+u+'" alt="'+it.name+' 海报" style="transform:scale(1)">';
      item.setAttribute("data-name", it.name);
      slide.appendChild(item);
      pos++;
    });
  });
  var curName = slide.children[viewerIdx] ? slide.children[viewerIdx].getAttribute("data-name") : "";
  document.getElementById("vTitle").textContent = curName;
  document.getElementById("vPage").textContent = (viewerIdx + 1) + " / " + viewTotal;
  resetZoomImgs();
  regLazy(slide);
}
function showViewer(){ document.getElementById("viewer").classList.add("show"); }
function hideViewer(){ document.getElementById("viewer").classList.remove("show"); }
function resetZoomImgs(){
  zoom = 1;
  var imgs = document.querySelectorAll("#vSlide .v-img");
  for (var i=0;i<imgs.length;i++){ imgs[i].style.transform = "scale(1)"; }
}
function toggleZoom(){
  zoom = zoom === 1 ? 1.8 : 1;
  var imgs = document.querySelectorAll("#vSlide .v-img");
  for (var i=0;i<imgs.length;i++){ imgs[i].style.transform = "scale("+zoom+")"; }
}
function moveTo(n){
  if (!viewTotal) return;
  viewerIdx = (n + viewTotal) % viewTotal;
  buildSlide();
}

document.getElementById("vClose").addEventListener("click", hideViewer);
document.getElementById("vPrev").addEventListener("click", function(){ moveTo(viewerIdx - 1); });
document.getElementById("vNext").addEventListener("click", function(){ moveTo(viewerIdx + 1); });
document.getElementById("vStage").addEventListener("click", function(e){
  if (e.target.classList.contains("v-img")){ toggleZoom(); }
});
document.addEventListener("keydown", function(e){
  if (!document.getElementById("viewer").classList.contains("show")) return;
  if (e.key === "Escape") hideViewer();
  if (e.key === "ArrowLeft") moveTo(viewerIdx - 1);
  if (e.key === "ArrowRight") moveTo(viewerIdx + 1);
});

/* 触摸滑动切换 */
var touchX = null;
var stage = document.getElementById("vStage");
stage.addEventListener("touchstart", function(e){ touchX = e.touches[0].clientX; }, {passive:true});
stage.addEventListener("touchend", function(e){
  if (touchX === null) return;
  var dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 48){
    if (dx < 0) moveTo(viewerIdx + 1);
    else moveTo(viewerIdx - 1);
  }
  touchX = null;
}, {passive:true});

/* ===== 联系客服 ===== */
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
/* 企微：弹二维码大图，长按识别 */
document.getElementById("btnWecom").addEventListener("click", function(){
  var qr = document.getElementById("qrmodal");
  document.getElementById("qrImg").src = WECOM_IMG;
  qr.classList.add("show");
});
document.getElementById("qrClose").addEventListener("click", function(){
  document.getElementById("qrmodal").classList.remove("show");
});
document.getElementById("qrmodal").addEventListener("click", function(e){
  if (e.target === this) document.getElementById("qrmodal").classList.remove("show");
});
/* Kook：直接跳转邀请链接 */
document.getElementById("btnKook").addEventListener("click", function(){
  if (CONTACT_URL){
    window.open(CONTACT_URL, "_blank");
  } else {
    showToast("联系链接尚未配置：把代码里的 CONTACT_URL 换成你的 Kook 邀请链接即可");
  }
});

/* ===== 初始化 ===== */
renderTabs();
renderGrid();
</script>
